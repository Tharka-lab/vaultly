<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8"><title>Vaultly — Configuration</title><style>body{font:14px Segoe UI,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#1e293b}label{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #94a3b8;border-radius:6px}button{margin-top:18px;padding:10px 14px;border:0;border-radius:6px;background:#6650e8;color:#fff;cursor:pointer}#status{margin-top:14px;color:#475569}</style></head>
  <body><h1>Connexion à Vaultly</h1><p>Dans Vaultly déverrouillé, ouvre Paramètres → Autoremplissage web → Copier la configuration.</p><label>Port local<input id="port" type="number" placeholder="ex. 24871"></label><label>Jeton temporaire<input id="token" type="password" placeholder="Colle le jeton Vaultly"></label><button id="save">Enregistrer et tester</button><div id="status"></div><script src="options.js"></script></body>
